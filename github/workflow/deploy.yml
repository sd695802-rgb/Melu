name: Deploy and Secure Melux

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Inject API Key Securely
      run: |
        # هنا غيرنا الاسم عشان يطابق اللي حطيته في الـ Secrets عندك يا boss man
        echo "const CONFIG = { GEMINI_API_KEY: '${{ secrets.AXIOM_API_KEY }}' };" > config.js

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: .
