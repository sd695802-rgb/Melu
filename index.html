<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melux - منصة الذكاء الاصطناعي</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #230a0f;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(50, 15, 22, 0.8);
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: #d1d1d1;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #ffffff;
            color: #230a0f;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #e0e0e0;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Melux</h1>
        <p>منصتك الذكية للتحكم بمستودعات غيت هاب وتوليد ملفات IPA بكل سهولة.</p>
        <a href="#" class="btn">ابدأ السحر الآن</a>
    </div>

</body>
</html>
